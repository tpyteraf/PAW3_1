<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="style.css" />
    <title>repl.it</title>
  </head>
  <body>
    <div>
      <form id="form1">
        <input
          id="inp1"
          name="inp1"
          type="text"
          placeholder="Wpisz nazwę kraju..."
        />
        <input type="submit" value="Szukaj kraju" id="btn1" />
      </form>
    </div>
    <div>
      <form id="form2">
        <input
          id="inp2"
          name="inp2"
          type="text"
          placeholder="Wpisz stolicę kraju..."
        />
        <input type="submit" value="Szukaj kraju" id="btn2" />
      </form>
    </div>
    <div>
      <form id="form3">
        <select id="region" name="region">
          <option disabled selected value="">Wybierz region...</option>
          <option value="Africa">Africa</option>
          <option value="Americas">Americas</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
        </select>
        <input type="submit" value="Szukaj kraju" id="btn3" />
      </form>
    </div>
    <div id="answer"></div>
    <script src="script.js"></script>
  </body>
</html>
